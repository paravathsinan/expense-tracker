<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">Expense Tracker</h1>
        <div class="balance">
            <h2>Your Balance</h2>
            <p id="balance">$0.00</p>
        </div>
        <div class="income-expense">
            <div>
                <h3>Income</h3>
                <p id="income">$0.00</p>
            </div>
            <div class="expenses">
                <h4>Expense</h4>
                <p id="expense">$0.00</p>
            </div>
        </div>
        <div class="form">
            <h3>Add Transaction</h3>
            <div class="form-control">
                <label for="text">Description</label>
                <input type="text" id="text" placeholder="Enter you Description">
            </div>
            <div class="form-control">
                <label for="text">Amount (negative-expense, positive-income)</label>
                <input type="text" id="text" placeholder="Enter Amount">
            </div>
            <button class="btn" id="add-transaction">Add Transaction</button>
        </div>
        <div class="history">
            <h3>Transaction History</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>
    <script src="/index.js"></script>
</body>
</html>
